[workspace]
members = [
    "crates/nloader-profile",
    "crates/nloader-camera",
    "crates/nloader-profile-gen",
    "crates/nloader-firmware",
    "crates/nloader-build",
    "crates/nloader-sdk",
    "crates/nloader-cli",
]
default-members = ["crates/nloader-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
publish = false

[workspace.dependencies]
nloader-profile = { path = "crates/nloader-profile" }
nloader-camera = { path = "crates/nloader-camera" }
nloader-profile-gen = { path = "crates/nloader-profile-gen" }
nloader-firmware = { path = "crates/nloader-firmware" }
nloader-build = { path = "crates/nloader-build" }
nloader-sdk = { path = "crates/nloader-sdk" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
sha1 = "0.10"
sha2 = "0.10"
hex = "0.4"
aes = "0.8"
ctr = "0.9"
rusb = "0.9"
tempfile = "3"
clap = { version = "4", features = ["derive"] }
object = { version = "0.36", default-features = false, features = ["read", "write", "std", "elf"] }
